<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent — S. Ashwin Kumar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        darkBg: '#07070a',
                        accentBlue: '#3b82f6',
                        accentEmerald: '#10b981',
                        accentPurple: '#a855f7'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #07070a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(13, 14, 20, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-emerald {
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.15);
        }
        @keyframes pulseCheck {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-check {
            animation: pulseCheck 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="p-4 sm:p-6 selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- Background Gradients -->
    <div class="fixed inset-0 pointer-events-none z-0 opacity-30 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(16,185,129,0.15),rgba(255,255,255,0))]"></div>

    <main class="relative z-10 w-full max-w-lg">
        <div class="glass-card p-8 sm:p-12 rounded-3xl text-center space-y-6 glow-emerald shadow-2xl">
            
            <!-- Animated Checkmark Icon -->
            <div class="w-20 h-20 mx-auto rounded-full bg-emerald-500/10 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-4xl animate-check">
                <i class="bi bi-check-lg"></i>
            </div>

            <!-- Header Badge -->
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 font-mono text-xs font-bold uppercase tracking-wider">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>MESSAGE SENT</span>
            </div>

            <!-- Title & Subtitle -->
            <div class="space-y-2">
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight font-mono uppercase">
                    Message Delivered
                </h1>
                <p class="text-slate-300 text-sm sm:text-base font-light leading-relaxed max-w-md mx-auto">
                    Thanks for reaching out! Your message has safely reached my inbox. I'll review it and get back to you soon.
                </p>
            </div>

            <!-- Navigation Buttons -->
            <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="/" class="w-full sm:w-auto px-6 py-3.5 rounded-full bg-emerald-500 hover:bg-emerald-400 text-black font-mono text-xs font-bold uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    <i class="bi bi-arrow-left"></i>
                    <span>← BACK TO PORTFOLIO</span>
                </a>
                
                <a href="https://www.linkedin.com/in/ashwin-kumar-s-5053bb272/" target="_blank" class="w-full sm:w-auto px-6 py-3.5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 text-slate-200 font-mono text-xs font-bold uppercase tracking-wider transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="bi bi-linkedin"></i>
                    <span>CONNECT ON LINKEDIN</span>
                </a>
            </div>

            <!-- Footer Meta -->
            <div class="pt-4 border-t border-white/10 text-[10px] font-mono text-slate-500">
                S. Ashwin Kumar · Software Engineer (Full Stack · AI/ML · Cloud)
            </div>

        </div>
    </main>

</body>
</html>
